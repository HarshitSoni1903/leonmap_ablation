scenario:
  name: hp_mp
  source_prefix: hp
  target_prefix: mp
  semra_landscape: phenotype       # used by SeMRA evidence

evidence:
  use_biomappings: false
  use_known_mappings: false
  use_semra: false
  prebuilt_tsv: data/hp_mp_gold.tsv
  cache_tsv: data/evidence_hp_mp.tsv
  src_col: src_id
  tgt_col: tgt_id

methods:
  - {name: bm25}
  - {name: tfidf}
  - {name: sapbert, model: base, boost: false}
  - {name: sapbert, model: base, boost: true}
  - {name: sapbert, model: ft,   boost: false}
  - {name: sapbert, model: ft,   boost: true}

ks: [1, 50, 100, 200]

collections:
  hp:
    source: owl
    model: ft
    owl_path: hp_enriched.owl
    id_prefixes: [HP_]
  mp:
    source: owl
    model: ft
    owl_path: mp_enriched.owl
    id_prefixes: [MP_]
  hp_base:
    source: owl
    model: base
    owl_path: hp_enriched.owl
    id_prefixes: [HP_]
  mp_base:
    source: owl
    model: base
    owl_path: mp_enriched.owl
    id_prefixes: [MP_]

data_prep:
  hp:
    url: http://purl.obolibrary.org/obo/hp.owl
    out_path: data/hp.owl
  mp:
    url: http://purl.obolibrary.org/obo/mp.owl
    out_path: data/mp.owl

mapper:
  run: true
  threshold: 0.9
  top_k: 1

keep_temp_config: true